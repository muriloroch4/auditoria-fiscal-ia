name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Validate JSON config files
        run: |
          python -m json.tool config/rules.json > /tmp/rules.json
          python -m json.tool config/simples_anexos.json > /tmp/simples_anexos.json
          python -m json.tool config/plano_contas_map.json > /tmp/plano_contas_map.json
          python -m json.tool config/consultivo_por_regra.json > /tmp/consultivo_por_regra.json
          python -m json.tool schemas/auditoria_trimestral.v3.schema.json > /tmp/auditoria_trimestral.v3.schema.json
          python -m json.tool schemas/auditoria_anual.v1.schema.json > /tmp/auditoria_anual.v1.schema.json

      - name: Compile Python files
        run: python -m compileall src tests

      - name: Validate frontend JavaScript
        run: |
          for script in src/auditoria/static/app*.js; do
            node --check "$script"
          done

      - name: Run tests with coverage
        run: |
          python -m coverage run -m unittest discover -v
          python -m coverage report

      - name: Run mypy
        run: python -m mypy src/auditoria --config-file pyproject.toml
