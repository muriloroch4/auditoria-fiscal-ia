[tool.mypy]
python_version = "3.11"
files = ["src/auditoria"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["src/auditoria"]
omit = ["src/auditoria/static/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
